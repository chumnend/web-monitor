services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: web_monitor_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build:
      context: ./app/backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/web_monitor_db
    entrypoint: sh -c "cd /app/backend && make migrate-up && /app/backend/bin/api"

  worker:
    build:
      context: ./app/backend
    restart: always
    depends_on:
      - db
      - backend
    environment:
      DATABASE_URL: postgres://user:password@db:5432/web_monitor_db
    entrypoint: sh -c "cd /app/backend && /app/backend/bin/worker"

  frontend:
    build:
      context: ./app/frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
