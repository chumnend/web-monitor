services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: web_monitor_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/web_monitor_db

  frontend:
    build:
      context: ./app/frontend
    ports:
      - "8081:80"
    depends_on:
      - web-monitor-backend

volumes:
  db_data:
